# ═══════════════════════════════════════════════════════════
# ZAIM Nginx Configuration
# Serves static React app + proxies gRPC-web to lightwalletd
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── CRITICAL: SharedArrayBuffer headers ──
    # WebZjs requires these for WASM multi-threading.
    # Without them, initThreadPool() will fail.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ── Security headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── WASM MIME type ──
    types {
        application/wasm wasm;
    }

    # ── Static files with caching ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add COOP/COEP since add_header in location blocks replaces parent
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # ── gRPC-web proxy to lightwalletd ──
    # ZAIM's wallet connects here for blockchain sync
    location /lwd/ {
        grpc_pass grpc://lightwalletd:9067;
        
        # gRPC-web support
        grpc_set_header Content-Type application/grpc;
        
        # CORS for gRPC-web
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Grpc-Web, X-User-Agent" always;
        add_header Access-Control-Expose-Headers "Grpc-Status, Grpc-Message, Grpc-Encoding, Grpc-Accept-Encoding" always;
        
        # COOP/COEP must be present on all responses
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;
}
