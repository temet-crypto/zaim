# Security headers for the host nginx. Include this snippet in the 443 server
# block AND inside every location that sets its own add_header, because nginx
# add_header inheritance is all or nothing: one add_header in a location wipes
# everything inherited from the server block.
#
#   server {
#       include snippets/zaim-security.conf;
#       location /assets/ {
#           include snippets/zaim-security.conf;
#           add_header Cache-Control "public, max-age=31536000, immutable";
#       }
#   }
#
# The CSP works because ZAIM makes no third party requests at all: fonts are
# served from /fonts, prices come through our own API, scripts are bundled.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
