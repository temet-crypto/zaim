# A v3 onion hostname is 62 characters, which overflows nginx's default 64 byte
# server name hash bucket once alignment overhead is counted. Without this the
# whole config is rejected at load with a server_names_hash error.
server_names_hash_bucket_size 128;

# ZAIM nginx — production (API-backed build), TLS terminated here.
# :80 stays up only for ACME renewals and the redirect. Everything real is :443.
#
# NOTE ON add_header: nginx does NOT merge add_header across levels. A location
# that declares even one add_header inherits NONE from the server block, so the
# full security set is repeated in /assets/ on purpose. Same trap as a `types`
# block silently replacing the whole MIME map. Do not "tidy" these away.
server {
    listen 80;
    server_name zaimwallet.com www.zaimwallet.com;

    # certbot --webroot writes here; must stay reachable over plain http
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }

    location / { return 301 https://zaimwallet.com$request_uri; }
}

# The v3 onion service. Tor already provides encryption and authenticates the
# host through the address itself, so this is plain :80 on purpose and carries
# no HSTS: there is no certificate to upgrade to, and telling a browser to force
# https on a .onion just breaks it. Order does not matter (nginx matches
# server_name exactly before falling back to the default server), but this block
# has to EXIST, or Tor visitors match the catch-all :80 block and get redirected
# straight back out to the clearnet site, which defeats the whole point.
server {
    listen 80;
    server_name kqf4zqfqw4knv7u6plpgaqpzcovy5mqdzjlbmn6zfsmo33vdu57qe5qd.onion;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;

    location /api/ {
        proxy_pass http://zaim-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.zaimwallet.com;
    ssl_certificate     /etc/letsencrypt/live/zaimwallet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaimwallet.com/privkey.pem;
    return 301 https://zaimwallet.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zaimwallet.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/zaimwallet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaimwallet.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # The page loads one module from /assets/ and talks to nothing but itself.
    # style-src needs unsafe-inline because the app styles elements inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    # index.html must revalidate: it names a content hashed bundle, and a stale
    # copy points at an asset that no longer exists.
    add_header Cache-Control "no-cache" always;
    # Tor Browser reads this and offers the onion instead. Only honoured over
    # https, which is why it lives here and not in the onion block.
    add_header Onion-Location "http://kqf4zqfqw4knv7u6plpgaqpzcovy5mqdzjlbmn6zfsmo33vdu57qe5qd.onion$request_uri" always;

    location /api/ {
        proxy_pass http://zaim-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;
}
