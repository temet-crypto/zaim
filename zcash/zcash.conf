# ZAIM — zcashd configuration
# Only needed if running docker-compose.yml (full stack)

# Network
mainnet=1
addnode=mainnet.z.cash

# RPC (lightwalletd connects here)
server=1
rpcuser=zaim
rpcpassword=zaim-lwd-rpc-change-me
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=8232

# Performance
dbcache=512
maxconnections=16

# Logging
printtoconsole=1
