# ═══════════════════════════════════════════════════════════
# ZAIM Docker Compose — Production Stack
#
# Services:
#   zaim-web    — React app (Nginx, port 80/443)
#   envoy       — gRPC-web proxy (bridges browser → lightwalletd)
#   lightwalletd — Zcash light wallet server
#   zcashd      — Zcash full node
#
# The browser talks to envoy (gRPC-web), which proxies to
# lightwalletd (gRPC), which reads from zcashd.
# ═══════════════════════════════════════════════════════════

version: "3.8"

services:
  # ── ZAIM Web App ──
  zaim-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaim-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/zaim-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - envoy
    networks:
      - zaim-net

  # ── Envoy gRPC-web Proxy ──
  # Bridges browser gRPC-web requests to native gRPC lightwalletd
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: zaim-envoy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - lightwalletd
    networks:
      - zaim-net

  # ── Zcash lightwalletd ──
  lightwalletd:
    image: electriccoinco/lightwalletd:latest
    container_name: zaim-lightwalletd
    restart: unless-stopped
    command: >
      --zcash-conf-path /srv/zcashd/zcash.conf
      --data-dir /srv/lightwalletd/data
      --log-file /dev/stdout
      --grpc-bind-addr 0.0.0.0:9067
    volumes:
      - lightwalletd-data:/srv/lightwalletd/data
      - zcashd-data:/srv/zcashd:ro
    depends_on:
      zcashd:
        condition: service_healthy
    networks:
      - zaim-net

  # ── Zcash Full Node ──
  zcashd:
    image: electriccoinco/zcashd:latest
    container_name: zaim-zcashd
    restart: unless-stopped
    volumes:
      - zcashd-data:/srv/zcashd
      - ./zcash/zcash.conf:/srv/zcashd/zcash.conf:ro
    healthcheck:
      test: ["CMD", "zcash-cli", "-conf=/srv/zcashd/zcash.conf", "getinfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # zcashd takes a while to start
    networks:
      - zaim-net

  # ── Let's Encrypt (SSL) ──
  certbot:
    image: certbot/certbot
    container_name: zaim-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  zcashd-data:
    driver: local
  lightwalletd-data:
    driver: local

networks:
  zaim-net:
    driver: bridge
